# Cost taxonomy: which cost labels a report uses for a company.
#   industrial: manufacturers (steel, metals, cement, chemicals, power, oil and gas ...). Costs are shown as materials,
#               employee cost and other operating expenses (power and fuel sit inside other expenses; the provider does
#               not split them). "Material margin" replaces "Contribution margin".
#   generic:    the original labels (SG&A, contribution margin). Used for services, consumer, retail, pharma, textiles and
#               brand businesses where those labels are acceptable, and for any sector not listed (with a stated limitation).
# Classification looks at the provider's sector, industry and macro sector (lower-case, substring match).
# Order: a generic keyword in the SECTOR wins first (so "Other Textile Products" stays generic), then industrial keywords.

generic_keywords:
  - textile
  - apparel
  - garment
  - home furnishing
  - software
  - it services
  - it -
  - information technology
